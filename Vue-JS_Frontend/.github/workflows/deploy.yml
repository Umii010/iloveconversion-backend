name: Deploy Vue.js to Hostinger via SSH

on:
  push:
    branches:
      - main  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install NPM dependencies and build Vue
        run: |
          npm ci
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Rsync Vue dist to server
        run: |
          rsync -avz --delete -e "ssh -p 65002 -o StrictHostKeyChecking=no" ./dist/ \
          u281898664@45.130.228.202:/home/u281898664/domains/taskbridge.devvault.io/public_html-temp/

      - name: SSH into server and finalize deployment
        run: |
          ssh -p 65002 -o StrictHostKeyChecking=no u281898664@45.130.228.202 << 'EOF'
            cd /home/u281898664/domains/taskbridge.devvault.io

            # Backup old public_html
            mv public_html public_html-backup-$(date +%s) || true

            # Swap new dist folder
            mv public_html-temp public_html

            echo "Vue.js site deployed successfully!"
          EOF
